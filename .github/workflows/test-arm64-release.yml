name: Test Arm64 Release

# Build a signed arm64 test APK from the personal branch and publish it as a
# pre-release. The signing key is generated per run so no Android signing
# secrets are required in a personal fork.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test build version (for example 2.2.11)"
        type: string
        default: "2.2.13"
        required: true

permissions:
  contents: write

env:
  CI: "true"
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"

jobs:
  build:
    name: Build and publish arm64 test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-android-sdk

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-test-arm64

      - name: Apply test version
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        run: pnpm tauri android init --ci

      - name: Build arm64 release APK
        run: pnpm tauri android build --apk --split-per-abi --target aarch64

      - name: Sign arm64 APK with a test key
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)"
          if [ -z "$APK" ]; then echo "::error::No release APK produced"; exit 1; fi
          KEYSTORE="$RUNNER_TEMP/test.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE" -alias hghubtest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hghubxtest -keypass hghubxtest \
            -dname "CN=HGhubX Test, OU=Test, O=HGhubX, L=Unknown, ST=Unknown, C=CN"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          OUT="artifacts/HGhubX_${VERSION}_test_arm64.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" --ks-key-alias hghubtest \
            --ks-pass pass:hghubxtest --key-pass pass:hghubxtest \
            --v4-signing-enabled false \
            --out "$OUT" "$APK"
          "$APKSIGNER" verify --print-certs "$OUT"
          AAPT2="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump badging "$OUT" | grep -m1 '^package:'
          "$AAPT2" dump badging "$OUT" | grep -m1 '^native-code:'
          rm -f "$KEYSTORE"
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: test-arm64-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish test pre-release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: test-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HGhubX test v${{ steps.version.outputs.version }} (arm64)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            arm64 test build from the `personal` branch.

            - Source commit: `${{ github.sha }}`
            - Merged changes: upstream main (#260, #262, #263, #267, #268) + `feat/super-resolution`
            - PR #260: tag pin and post like/favorite hints share the action toast slot
            - PR #262: hot authors show 7 + 7 (top 14) and the hot-author refresh stays on the search page
            - PR #267: hot tags show 10 + 10 and the search-page hot tags/hot-search refresh buttons are kept
            - Super resolution: experimental WebGL2 FSR, CAS/detail modes from `feat/super-resolution` are included for testing.
            - Test controls: More → Picture Enhancement has Auto / 1x / 2x output scaling and an on-video SR status badge.
            - Hold-to-compare: hold the on-video "按住看原画" button to reveal the native video at the same frame; release restores SR.
            - 1x applies the shader at source resolution; 2x renders at twice the source size (1080p becomes 2160p internally) and is test-only.
            - Detail mode still rejects sources above 1.5MP, so 1080p detail shows "unavailable" in the badge.
            - Signing: ephemeral test key (uninstall the official app before installing this build)
          files: artifacts/HGhubX_*_test_arm64.apk
