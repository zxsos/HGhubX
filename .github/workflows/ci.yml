name: CI
run-name: "CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && format('{0} ({1})', inputs.mode, github.ref_name) || github.ref_name) }}"

# 标准版持续集成（CI）：PR、推送 main 或手动触发时执行前端、Rust、Smoke 与播放诊断。
# 打包与正式发版（v*）见独立 CD 工作流 .github/workflows/release.yml。
# TV 版持续集成与独立发版分别见 .github/workflows/tv.yml 与 .github/workflows/tv-release.yml。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：ci 跑全量校验；playback 只跑播放诊断"
        type: choice
        default: ci
        options: [ci, playback]
      scenarios:
        description: "播放诊断场景：all 或逗号分隔子集"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI: "true"

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ci'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Version fields
        run: node scripts/check-version-sync.mjs
      - name: i18n dictionaries
        run: node scripts/check-i18n.mjs
      - name: Documentation links
        run: node scripts/check-doc-links.mjs
      - name: Build frontend
        run: pnpm build
      - name: Size budgets
        run: node scripts/check-size-budgets.mjs

  rust:
    name: Rust check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ci'
    steps:
      - uses: actions/checkout@v7
      - name: Cache Linux WebKitGTK .deb packages
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ~/apt-webkit-debs
          key: apt-webkit-ubuntu24-v1
      - name: Install system dependencies
        run: |
          install_from_mirror() {
            mkdir -p ~/apt-webkit-debs
            sudo rm -rf /var/lib/apt/lists/*
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
            printf 'https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i -E 's|^URIs:.*|URIs: https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i -E 's|https?://[^/[:space:]]+/ubuntu/?|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Dir::Cache::archives="$HOME/apt-webkit-debs" -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
              install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
            sudo rm -rf ~/apt-webkit-debs/lock ~/apt-webkit-debs/partial 2>/dev/null || true
            sudo chown -R "$USER:$USER" ~/apt-webkit-debs
          }
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && compgen -G "$HOME/apt-webkit-debs/*.deb" >/dev/null; then
            echo "Installing WebKitGTK dependencies from cached .deb packages..."
            if ! (sudo dpkg --unpack ~/apt-webkit-debs/*.deb && sudo dpkg --configure -a); then
              sudo apt-get -f install -y || true
              rm -rf ~/apt-webkit-debs/*
              install_from_mirror
            fi
          else
            install_from_mirror
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ci-rust
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

  smoke:
    name: Browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ci'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve pre-installed Chrome (or fallback to Playwright Chromium)
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            BROWSER="/usr/bin/google-chrome"
          else
            pnpm exec playwright-core install --with-deps chromium
            BROWSER="$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")"
          fi
          echo "Using browser: $BROWSER"
          echo "BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
      - name: Run smoke fixtures
        run: pnpm test:smoke

  playback:
    name: Playback (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          (inputs.scenarios == '' || inputs.scenarios == 'all') &&
          fromJSON('{"include":[{"shard":"core","scenarios":"seek,legacy,lifecycle,gesture,proxy,portrait-fit,ambient,post-flicker"},{"shard":"extended","scenarios":"episode-toast,balance-volume,ios-native,recovery,review"}]}') ||
          fromJSON(format('{{"include":[{{"shard":"custom","scenarios":{0}}}]}}', toJSON(inputs.scenarios)))
        }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache FFmpeg .deb packages
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ~/apt-ffmpeg-debs
          key: apt-ffmpeg-ubuntu24-v1
      - name: Resolve pre-installed FFmpeg & Chrome
        run: |
          install_ffmpeg_from_mirror() {
            mkdir -p ~/apt-ffmpeg-debs
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i -E 's|^URIs:.*|URIs: https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Dir::Cache::archives="$HOME/apt-ffmpeg-debs" -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
              install -y --no-install-recommends ffmpeg
            sudo rm -rf ~/apt-ffmpeg-debs/lock ~/apt-ffmpeg-debs/partial 2>/dev/null || true
            sudo chown -R "$USER:$USER" ~/apt-ffmpeg-debs
          }
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" = "true" ] && compgen -G "$HOME/apt-ffmpeg-debs/*.deb" >/dev/null; then
              echo "Installing FFmpeg from cached .deb packages..."
              if ! (sudo dpkg --unpack ~/apt-ffmpeg-debs/*.deb && sudo dpkg --configure -a); then
                sudo apt-get -f install -y || true
                rm -rf ~/apt-ffmpeg-debs/*
                install_ffmpeg_from_mirror
              fi
            else
              install_ffmpeg_from_mirror
            fi
          fi
          if [ -x /usr/bin/google-chrome ]; then
            BROWSER="/usr/bin/google-chrome"
          else
            pnpm exec playwright-core install --with-deps chromium
            BROWSER="$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")"
          fi
          echo "Using browser: $BROWSER, ffmpeg: $(command -v ffmpeg)"
          echo "BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
      - name: Run playback checks and collect diagnostics
        env:
          PLAYBACK_SCENARIOS: ${{ matrix.scenarios }}
        run: pnpm test:playback --browser-executable "$BROWSER_EXECUTABLE" --scenarios "$PLAYBACK_SCENARIOS" --output test-results/playback-ci
      - name: Upload diagnostics even when a check fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playback-diagnostics-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
