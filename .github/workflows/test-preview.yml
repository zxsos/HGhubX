name: Test Preview
run-name: "Test Preview · ${{ github.event_name == 'workflow_dispatch' && inputs.platforms != 'all' && format('manual ({0})', inputs.platforms) || (github.event_name == 'workflow_dispatch' && 'manual (all)' || 'auto build') }}"

# 全平台测试预览构建与发布工作流：
# - 自动模式：监听 `Sync Test Branch` 完成事件（workflow_run），不直接挂载在 PR 检查页上，
#   因此并发取消旧构建时绝不会把任何 PR 标红或标取消；
# - 手动模式：支持按需选择 `all` 或单平台重编并原地更新 `test-pre` 对应资产；
# - 隔离安全：7 平台构建机无密钥，独立干净运行器签名 APK 并原地零空窗滚动更新 `test-pre`。
on:
  workflow_run:
    workflows: ["Sync Test Branch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建平台范围：all 全平台；或指定单平台覆盖更新 test-pre 对应产物"
        type: choice
        default: all
        options: [all, windows, android, android-tv, macos, ios, linux, harmonyos]

permissions:
  contents: read

env:
  CI: "true"

jobs:
  prepare:
    name: Prepare test preview metadata
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: 下载 Sync Test Branch 元数据
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: test-sync-bundle
          path: test-sync-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - name: 手动触发时同步 test 分支
        id: manual_sync
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_NOTES_PATH: test-sync-bundle/test-release-notes.md
        run: |
          mkdir -p test-sync-bundle
          node scripts/sync-test-branch.mjs
          node -e '
            const fs = require("node:fs");
            const out = fs.readFileSync(process.env.GITHUB_OUTPUT, "utf8");
            const read = (k) => (out.match(new RegExp("^" + k + "=(.*)$", "m"))?.[1] || "").trim();
            fs.writeFileSync("test-sync-bundle/meta.json", JSON.stringify({
              should_build: read("should_build") === "true",
              commit_sha: read("commit_sha"),
              short_sha: read("short_sha"),
            }, null, 2));
          '
      - name: 解析构建元数据
        id: meta
        run: |
          node -e '
            const fs = require("node:fs");
            const meta = JSON.parse(fs.readFileSync("test-sync-bundle/meta.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `should_build=${meta.should_build ? "true" : "false"}\n` +
              `commit_sha=${meta.commit_sha || ""}\n` +
              `short_sha=${meta.short_sha || ""}\n`);
            console.log("Resolved preview metadata:", JSON.stringify(meta));
          '
      - uses: actions/upload-artifact@v7
        if: steps.meta.outputs.should_build == 'true'
        with:
          name: test-release-notes
          path: test-sync-bundle/test-release-notes.md
          if-no-files-found: error

  windows:
    name: Test · Windows (setup + portable)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows')
    concurrency:
      group: test-preview-windows
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis
      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/hghubx.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhubX.exe"
          Compress-Archive -Path "artifacts/HGhubX.exe" -DestinationPath "artifacts/HGhubX_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhubX.exe"
          Get-ChildItem artifacts | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: ready-windows
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Test · Android (split per ABI)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'android')
    concurrency:
      group: test-preview-android
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-android-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-standard
      - name: 生成 Android 工程
        run: pnpm tauri android init --ci
      - name: 编译未签名 APK（按 ABI 分包）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          mkdir -p unsigned
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "unsigned/HGhubX_${VERSION}_${abi}.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 Android release APK"; exit 1; fi
          ls -lh unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android
          path: unsigned/*
          if-no-files-found: error

  android-tv:
    name: Test · Android TV (split per ABI)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'android-tv')
    concurrency:
      group: test-preview-android-tv
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取 TV 版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.tv.conf.json').version")"
          node scripts/set-version.mjs --target tv "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "HGHUBX_APP_VERSION=$V" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-android-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-tv
      - name: 选择 Android TV 配置并生成工程
        run: |
          cp src-tauri/tauri.tv.conf.json src-tauri/tauri.android.conf.json
          pnpm tauri android init --ci
      - name: 编译未签名 TV APK（按 ABI 分包）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          mkdir -p unsigned
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "unsigned/HGhubX-TV_${VERSION}_${abi}.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 TV release APK"; exit 1; fi
          ls -lh unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android-tv
          path: unsigned/*
          if-no-files-found: error

  macos:
    name: Test · macOS (universal dmg)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos')
    concurrency:
      group: test-preview-macos
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: macos
      - name: 构建（Universal dmg）
        run: pnpm tauri build --target universal-apple-darwin
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "src-tauri/target/universal-apple-darwin/release/bundle/dmg/"*.dmg \
             "artifacts/HGhubX_${{ steps.ver.outputs.version }}_universal.dmg"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ready-macos
          path: artifacts/*
          if-no-files-found: error

  ios:
    name: Test · iOS (unsigned ipa)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'ios')
    concurrency:
      group: test-preview-ios
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - uses: ./.github/actions/setup-ios-project
      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ready-ios
          path: artifacts/*
          if-no-files-found: error

  linux:
    name: Test · Linux (deb / rpm)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux')
    concurrency:
      group: test-preview-linux
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-webkitgtk
        with:
          cache-key: apt-webkit-ubuntu22-v1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: linux
      - name: 构建（deb / rpm）
        run: pnpm tauri build
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "artifacts/HGhubX_${{ steps.ver.outputs.version }}_amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "artifacts/HGhubX_${{ steps.ver.outputs.version }}_x86_64.rpm"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ready-linux
          path: artifacts/*
          if-no-files-found: error

  harmonyos:
    name: Test · HarmonyOS (unsigned hap)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'harmonyos')
    concurrency:
      group: test-preview-harmonyos
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HARMONY_TOOLS_DIR: /home/runner/harmony
      DEVECO_SDK_HOME: /home/runner/harmony/command-line-tools/sdk
      OHOS_HOME: /home/runner/harmony/command-line-tools/sdk/default/openharmony
      OHOS_NDK_HOME: /home/runner/harmony/command-line-tools/sdk/default/openharmony
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号并切换 OHOS 依赖
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          node scripts/patch-ohos-cargo.mjs
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - name: 安装原生构建依赖
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
          printf 'https://mirrors.tuna.tsinghua.edu.cn/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E 's|^URIs:.*|URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i -E 's|https?://[^/[:space:]]+/ubuntu/?|https://mirrors.tuna.tsinghua.edu.cn/ubuntu/|g' /etc/apt/sources.list
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config libssl-dev \
            default-jdk-headless unzip zip jq
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos
      - name: Restore HarmonyOS Command Line Tools 26.0.0.821 cache
        id: ohos-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/harmony
          key: ohos-sdk-26.0.0.821-linux-amd64-v1
      - name: Install HarmonyOS Command Line Tools 26.0.0.821
        if: steps.ohos-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          base="https://github.com/ErBWs/ohos-sdk/releases/download/26.0.0.821/ohos-sdk-linux-amd64.tar.gz"
          curl --fail --location --retry 3 "$base.aa" -o "$work/sdk.aa"
          curl --fail --location --retry 3 "$base.ab" -o "$work/sdk.ab"
          cat "$work/sdk.aa" "$work/sdk.ab" > "$work/ohos-sdk-linux-amd64.tar.gz"
          rm -f "$work/sdk.aa" "$work/sdk.ab"
          printf '%s  %s\n' \
            0cbdf7ac5c1be1e42694d448ffaee0c0be0ba9a948197e2bc5b61ca5bdc481f2 "$work/ohos-sdk-linux-amd64.tar.gz" \
            | sha256sum -c -
          mkdir -p "$HARMONY_TOOLS_DIR"
          tar -xzf "$work/ohos-sdk-linux-amd64.tar.gz" -C "$HARMONY_TOOLS_DIR"
      - name: Save HarmonyOS SDK cache
        if: steps.ohos-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/harmony
          key: ohos-sdk-26.0.0.821-linux-amd64-v1
      - name: Restore OHOS Tauri CLI and ohrs cache
        id: ohos-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ohos-tools
          key: ohos-tools-richerfu-00c8756-ohrs-1.5.0-v1
      - name: Install ohrs and richerfu tauri-cli (feat-openharmony)
        if: steps.ohos-tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
            cargo install ohrs --version 1.5.0 --locked --root /home/runner/.ohos-tools
          CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
            cargo install tauri-cli \
            --git https://github.com/richerfu/tauri \
            --rev 00c8756 \
            --root /home/runner/.ohos-tools \
            --no-default-features --features native-tls
      - name: Save OHOS Tauri CLI and ohrs cache
        if: steps.ohos-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ohos-tools
          key: ohos-tools-richerfu-00c8756-ohrs-1.5.0-v1
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          prefix-key: ohos-exp-v1
      - name: 配置 OHOS 交叉编译环境
        run: |
          set -euo pipefail
          echo "/home/runner/.ohos-tools/bin" >> "$GITHUB_PATH"
          echo "$HARMONY_TOOLS_DIR/command-line-tools/bin" >> "$GITHUB_PATH"
          OHOS_NATIVE_HOME="$OHOS_HOME/native"
          wrapper_dir="$RUNNER_TEMP/ohos-compilers"
          mkdir -p "$wrapper_dir"
          for compiler in clang clang++; do
            printf '#!/usr/bin/env bash\nexec "%s/llvm/bin/%s" --target=aarch64-linux-ohos --sysroot="%s/sysroot" -D__MUSL__ "$@"\n' \
              "$OHOS_NATIVE_HOME" "$compiler" "$OHOS_NATIVE_HOME" > "$wrapper_dir/aarch64-$compiler"
            chmod +x "$wrapper_dir/aarch64-$compiler"
          done
          {
            echo "OHOS_NATIVE_HOME=$OHOS_NATIVE_HOME"
            echo "CC_aarch64_unknown_linux_ohos=$wrapper_dir/aarch64-clang"
            echo "CXX_aarch64_unknown_linux_ohos=$wrapper_dir/aarch64-clang++"
            echo "AR_aarch64_unknown_linux_ohos=$OHOS_NATIVE_HOME/llvm/bin/llvm-ar"
            echo "RANLIB_aarch64_unknown_linux_ohos=$OHOS_NATIVE_HOME/llvm/bin/llvm-ranlib"
            echo "CXXSTDLIB_aarch64_unknown_linux_ohos=c++"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$wrapper_dir/aarch64-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_ohos=--target=aarch64-linux-ohos --sysroot=$OHOS_NATIVE_HOME/sysroot -D__MUSL__"
          } >> "$GITHUB_ENV"
      - name: 编译并收集未签名 HAP
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          cargo tauri --version
          ohrs --version
          pnpm build
          cd src-tauri
          cargo tauri ohos init --ci
          if [ -f "$ROOT/scripts/patch-ohos-project.mjs" ]; then
            node "$ROOT/scripts/patch-ohos-project.mjs"
          fi
          set +e
          cargo tauri ohos build \
            --ci \
            --target aarch64 \
            --ignore-version-mismatches \
            --config "{\"build\":{\"beforeBuildCommand\":\"pnpm --dir '${ROOT}' build\"}}"
          build_rc=$?
          set -e
          echo "cargo tauri ohos build exited with: $build_rc"
          hap_path="$(find "$ROOT/src-tauri/gen/ohos" -name "*.hap" 2>/dev/null | head -n 1 || true)"
          so_path="$(find "$ROOT/src-tauri/gen/ohos" "$ROOT/src-tauri/target" -name "libhghubx_lib.so" 2>/dev/null | head -n 1 || true)"
          if [ -z "$so_path" ]; then
            echo "Rust cdylib libhghubx_lib.so was not produced; failing early."
            exit "${build_rc:-1}"
          fi
          if [ -z "$hap_path" ]; then
            echo "libhghubx_lib.so built ($so_path), trying direct ohpm + hvigorw assembly..."
            cd "$ROOT/src-tauri/gen/ohos"
            ohpm install
            hvigorw clean --no-daemon
            hvigorw assembleHap -p module=entry_mobile@default --no-daemon --stacktrace
            hap_path="$(find "$ROOT/src-tauri/gen/ohos" -name "*.hap" 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$hap_path" && test -f "$hap_path"
          unzip -l "$hap_path" | grep -E "libhghubx_lib\.so|module\.json|ets/modules\.abc"
          mkdir -p "$ROOT/artifacts"
          cp "$hap_path" "$ROOT/artifacts/HGhubX_${VERSION}_ohos_arm64_unsigned.hap"
          ls -lh "$ROOT/artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: ready-harmonyos
          path: artifacts/*
          if-no-files-found: error

  publish-test-pre:
    name: Sign & Publish test-pre Pre-release
    needs: [prepare, windows, android, android-tv, macos, linux, ios, harmonyos]
    # 独立干净运行器（不检出 PR 代码）：按平台范围签名 APK 并原地零空窗滚动更新 `test-pre`
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.outputs.should_build == 'true' &&
      (
        ((github.event_name != 'workflow_dispatch' || inputs.platforms == 'all') &&
          needs.windows.result == 'success' &&
          needs.android.result == 'success' &&
          needs.android-tv.result == 'success' &&
          needs.macos.result == 'success' &&
          needs.linux.result == 'success' &&
          (needs.ios.result == 'success' || needs.ios.result == 'failure') &&
          (needs.harmonyos.result == 'success' || needs.harmonyos.result == 'failure')) ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows' && needs.windows.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'android' && needs.android.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'android-tv' && needs.android-tv.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'macos' && needs.macos.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'ios' && needs.ios.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'linux' && needs.linux.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'harmonyos' && needs.harmonyos.result == 'success')
      )
    concurrency:
      group: test-preview-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 下载构建产物与版本说明
        uses: actions/download-artifact@v8
        with:
          path: downloaded
      - name: 隔离签名 Android / TV APK 并汇总待发布产物
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for dir in downloaded/ready-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/* release-assets/
          done

          shopt -s nullglob
          UNSIGNED_APKS=(downloaded/unsigned-*/*.apk)
          if [ "${#UNSIGNED_APKS[@]}" -gt 0 ]; then
            if [ -z "${KEYSTORE_BASE64:-}" ]; then
              echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名测试 APK"; exit 1
            fi
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            BT="$(ls "$SDK/build-tools" 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$BT" ]; then
              SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
              yes | "$SDKM" --licenses > /dev/null 2>&1 || true
              "$SDKM" --install "build-tools;36.0.0"
              BT="36.0.0"
            fi
            APKSIGNER="$SDK/build-tools/$BT/apksigner"
            AAPT2="$SDK/build-tools/$BT/aapt2"
            KS="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            for f in "${UNSIGNED_APKS[@]}"; do
              out="release-assets/$(basename "$f")"
              "$APKSIGNER" sign \
                --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
                --v4-signing-enabled false \
                --out "$out" "$f"
              "$APKSIGNER" verify --print-certs "$out" | head -3
              "$AAPT2" dump badging "$out" | grep -m1 "^package:"
            done
            rm -f "$KS"
          fi

          shopt -u nullglob
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::未找到任何待发布产物"; exit 1
          fi
          ls -lh release-assets
      - name: 原地滚动更新 test-pre 预发布页（零 404 空窗，不抢占 Latest）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TEST_SHA: ${{ needs.prepare.outputs.commit_sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          SELECTED_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          if gh release view test-pre --repo "$REPO" >/dev/null 2>&1; then
            if gh api "repos/$REPO/git/refs/tags/test-pre" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/test-pre" -f sha="$TEST_SHA" -F force=true >/dev/null
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/test-pre" -f sha="$TEST_SHA" >/dev/null
            fi
            gh release upload test-pre release-assets/* --clobber --repo "$REPO"
            if [ "$SELECTED_PLATFORMS" = "all" ]; then
              NEW_NAMES="$(cd release-assets && printf '%s\n' *)"
              OLD_NAMES="$(gh release view test-pre --repo "$REPO" --json assets --jq '.assets[].name')"
              while IFS= read -r old; do
                [ -n "$old" ] || continue
                if ! printf '%s\n' "$NEW_NAMES" | grep -Fxq "$old"; then
                  gh release delete-asset test-pre "$old" --yes --repo "$REPO" || true
                fi
              done <<< "$OLD_NAMES"
            fi
            gh release edit test-pre \
              --repo "$REPO" \
              --title "HGhubX Test Preview (${SHORT_SHA})" \
              --notes-file downloaded/test-release-notes/test-release-notes.md \
              --prerelease \
              --latest=false
          else
            gh release create test-pre release-assets/* \
              --repo "$REPO" \
              --target "$TEST_SHA" \
              --title "HGhubX Test Preview (${SHORT_SHA})" \
              --notes-file downloaded/test-release-notes/test-release-notes.md \
              --prerelease \
              --latest=false
          fi
