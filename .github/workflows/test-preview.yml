name: Test Preview

# 自动集成测试预览工作流：
# 1. 通过单一 `test` PR 标签驱动信任继承（首次打标自动合入并继承到后续新 PR；移除标签即撤销并清空历史继承）。
# 2. 从最新 `main` 自动合并所有打开中、非草稿且带 `test` 标签的无冲突 PR 到 `test` 分支。
# 3. 隔离全平台构建并在独立干净运行器签名 APK，自动滚动更新 `test-pre` 预发布页（不抢占 Latest，不触发正式版自动更新）。
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-preview
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  sync-test:
    name: Sync test branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
      short_sha: ${{ steps.sync.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 合并可信测试 PR 至 test 分支
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_NOTES_PATH: test-release-notes.md
        run: node scripts/sync-test-branch.mjs
      - uses: actions/upload-artifact@v7
        if: steps.sync.outputs.should_build == 'true'
        with:
          name: test-release-notes
          path: test-release-notes.md
          if-no-files-found: error

  windows:
    name: Test · Windows (setup + portable)
    needs: [sync-test]
    if: needs.sync-test.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-test.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis
      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/hghubx.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhubX.exe"
          Compress-Archive -Path "artifacts/HGhubX.exe" -DestinationPath "artifacts/HGhubX_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhubX.exe"
          Get-ChildItem artifacts | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: ready-windows
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Test · Android (split per ABI)
    needs: [sync-test]
    if: needs.sync-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-test.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-standard
      - run: pnpm install --frozen-lockfile
      - name: 生成 Android 工程
        run: pnpm tauri android init --ci
      - name: 编译未签名 APK（按 ABI 分包）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          mkdir -p unsigned
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "unsigned/HGhubX_${VERSION}_${abi}.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 Android release APK"; exit 1; fi
          ls -lh unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android
          path: unsigned/*
          if-no-files-found: error

  android-tv:
    name: Test · Android TV (split per ABI)
    needs: [sync-test]
    if: needs.sync-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-test.outputs.commit_sha }}
      - name: 读取 TV 版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.tv.conf.json').version")"
          node scripts/set-version.mjs --target tv "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "HGHUBX_APP_VERSION=$V" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-tv
      - run: pnpm install --frozen-lockfile
      - name: 选择 Android TV 配置并生成工程
        run: |
          cp src-tauri/tauri.tv.conf.json src-tauri/tauri.android.conf.json
          pnpm tauri android init --ci
      - name: 编译未签名 TV APK（按 ABI 分包）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          mkdir -p unsigned
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "unsigned/HGhubX-TV_${VERSION}_${abi}.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 TV release APK"; exit 1; fi
          ls -lh unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android-tv
          path: unsigned/*
          if-no-files-found: error

  macos:
    name: Test · macOS (universal dmg)
    needs: [sync-test]
    if: needs.sync-test.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-test.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: macos
      - run: pnpm install --frozen-lockfile
      - name: 构建（Universal dmg）
        run: pnpm tauri build --target universal-apple-darwin
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "src-tauri/target/universal-apple-darwin/release/bundle/dmg/"*.dmg \
             "artifacts/HGhubX_${{ steps.ver.outputs.version }}_universal.dmg"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ready-macos
          path: artifacts/*
          if-no-files-found: error

  ios:
    name: Test · iOS (unsigned ipa)
    needs: [sync-test]
    if: needs.sync-test.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-test.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: pnpm install --frozen-lockfile
      - name: 生成 iOS 工程（带横竖屏 + ATS）
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done
      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ready-ios
          path: artifacts/*
          if-no-files-found: error

  linux:
    name: Test · Linux (deb)
    needs: [sync-test]
    if: needs.sync-test.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-test.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: 缓存 Linux WebKitGTK .deb 依赖
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ~/apt-webkit-debs
          key: apt-webkit-ubuntu22-v1
      - name: 安装系统依赖
        run: |
          install_from_mirror() {
            mkdir -p ~/apt-webkit-debs
            sudo rm -rf /var/lib/apt/lists/*
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
            printf 'https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i -E 's|https?://[^/[:space:]]+/ubuntu/?|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Dir::Cache::archives="$HOME/apt-webkit-debs" -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
              install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
            sudo rm -rf ~/apt-webkit-debs/lock ~/apt-webkit-debs/partial 2>/dev/null || true
            sudo chown -R "$USER:$USER" ~/apt-webkit-debs
          }
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && compgen -G "$HOME/apt-webkit-debs/*.deb" >/dev/null; then
            if ! (sudo dpkg --unpack ~/apt-webkit-debs/*.deb && sudo dpkg --configure -a); then
              sudo apt-get -f install -y || true
              rm -rf ~/apt-webkit-debs/*
              install_from_mirror
            fi
          else
            install_from_mirror
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: linux
      - run: pnpm install --frozen-lockfile
      - name: 构建（deb）
        run: pnpm tauri build
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "artifacts/HGhubX_${{ steps.ver.outputs.version }}_amd64.deb"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ready-linux
          path: artifacts/*
          if-no-files-found: error

  publish-test-pre:
    name: Sign & Publish test-pre Pre-release
    needs: [sync-test, windows, android, android-tv, macos, linux, ios]
    # 独立干净运行器（不检出 PR 代码）：执行 APK 签名并滚动更新 `test-pre` 预发布页
    if: >-
      always() &&
      !cancelled() &&
      needs.sync-test.outputs.should_build == 'true' &&
      needs.windows.result == 'success' &&
      needs.android.result == 'success' &&
      needs.android-tv.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.linux.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 下载构建产物与版本说明
        uses: actions/download-artifact@v8
        with:
          path: downloaded
      - name: 隔离签名 Android / TV APK 并汇总全平台产物
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名测试 APK"; exit 1
          fi
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls "$SDK/build-tools" 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BT" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "build-tools;36.0.0"
            BT="36.0.0"
          fi
          APKSIGNER="$SDK/build-tools/$BT/apksigner"
          AAPT2="$SDK/build-tools/$BT/aapt2"
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"

          mkdir -p release-assets
          for dir in downloaded/ready-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/* release-assets/
          done

          signed=0
          for f in downloaded/unsigned-*/*.apk; do
            [ -f "$f" ] || continue
            out="release-assets/$(basename "$f")"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            "$AAPT2" dump badging "$out" | grep -m1 "^package:"
            signed=$((signed+1))
          done
          rm -f "$KS"
          if [ "$signed" -eq 0 ]; then echo "::error::未找到待签名 APK"; exit 1; fi
          ls -lh release-assets
      - name: 滚动更新 test-pre 预发布页（不抢占 Latest）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TEST_SHA: ${{ needs.sync-test.outputs.commit_sha }}
          SHORT_SHA: ${{ needs.sync-test.outputs.short_sha }}
        run: |
          set -euo pipefail
          gh release delete test-pre --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create test-pre release-assets/* \
            --repo "$REPO" \
            --target "$TEST_SHA" \
            --title "HGhubX Test Preview (${SHORT_SHA})" \
            --notes-file downloaded/test-release-notes/test-release-notes.md \
            --prerelease \
            --latest=false
